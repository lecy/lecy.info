# ---- Management -----------------------------------------------------------

- title: Data for the Public Good
  code: PAF 586
  group: management
  description: "Techniques for data extraction, analysis, and visualization, and strategies for bringing data into management practice in public and nonprofit organizations."
  links:
    - {label: Course site, url: "http://ds4ps.org/paf-586-summer-2019/"}
    - {label: Reading summaries, url: "http://ds4ps.org"}
    - {label: GSU adaptation, url: "https://aysps.github.io/bigdata4publicgood/"}

- title: Public Organizations and Management
  group: management
  description: "Strategic planning, performance management, motivation, collaboration, and decision making in the public sector."
  links:
    - {label: Syllabus, url: "s/2016-Spring-POM-Syllabus-for-Lecy.pdf"}

- title: Nonprofit Management
  group: management
  description: "The history of the nonprofit sector, theories that guide nonprofit research, and governance and leadership challenges."
  links:
    - {label: Syllabus, url: "s/Nonprofit-Management-Spring-2016-Lecy.pdf"}

# ---- Data & statistics ------------------------------------------------------

- title: Intro to Data Science for the Social Sector
  group: data
  description: "A practical, tools-based introduction to data programming in R, visualization, automated reporting, and dashboards. No prior programming experience assumed."
  links:
    - {label: Course site, url: "https://ds4ps.org/cpp-526-fall-2019/"}

- title: Program Evaluation
  group: data
  description: "Quantitative modeling of program impact: regression, panel methods, instrumental variables, matching, regression discontinuity, and natural experiments."
  links:
    - {label: Course site, url: "https://ds4ps.org/cpp-523-fall-2019/"}

- title: Data-Driven Management in Public Organizations
  group: data
  description: "Performance management and data programming. Student teams build a model performance management system and KPI dashboard."
  links: []

# ---- Public policy ---------------------------------------------------------

- title: Urban Policy
  group: policy
  description: "The economics of cities, sprawl and the urban/suburban divide, tools of economic development, and GIS labs in spatial analysis."
  links: []

