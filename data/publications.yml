# One entry per publication. Newest first isn't required: pages sort by year.
#
# Fields
#   title:    required
#   authors:  as you want them printed; "Lecy" is bolded automatically
#   year:     number (use 9999 for "forthcoming" / working papers if you like)
#   venue:    journal, book, or publisher
#   details:  volume / issue / pages (optional)
#   type:     one of: Article, Chapter, Book, Report, Working Paper
#   featured: true  -> also shown under "Selected publications" on the home page
#   note:     optional award or remark
#   links:    list of {label, url}. Common labels: PDF, DOI, Code, Data,
#             Replication, Methods, Report, Review, Protocol, R package
#
# Paths starting with s/ are PDFs from the old Squarespace site; keep the files
# in the s/ folder so old links to lecy.info/s/... keep working.
# -------------------------------------------------------------------------

