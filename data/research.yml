# Research resources -------------------------------------------------------
#
# Each entry becomes a card on research.qmd. `group` decides which section it
# appears in: software | data | methods | policy
#
#   title, description, group: required
#   tag:   short label shown on the card (e.g. "R package", "Dataset")
#   links: list of {label, url}; the first link is the card's main link
# -------------------------------------------------------------------------

